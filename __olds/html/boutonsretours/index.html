<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Maison</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#032e30">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>ELIoT</h1>
    </header>

    <p id="hors-ligne" hidden>Connexion au serveur perdue</p>

    <!-- Onglets : un bouton par pièce, data-tab = id de la section -->
    <nav class="tabs" role="tablist">
        <button class="tab active" role="tab" data-tab="salon">Salon</button>
        <button class="tab" role="tab" data-tab="cuisine">Cuisine</button>
    </nav>

    <main>
        <!-- Une section par pièce -->
        <section id="salon" class="room" role="tabpanel">
            <div class="grid">
                <button class="device" data-room="salon" data-device="lumiere1" data-action="toggle">
                    <span class="label">Lumière 1</span>
                </button>
            </div>
        </section>

        <section id="cuisine" class="room" role="tabpanel" hidden>
            <div class="grid">
                <button class="device" data-room="cuisine" data-device="lumiere1" data-action="toggle">
                    <span class="label">Lumière 1</span>
                </button>
            </div>
        </section>
    </main>

    <script>
        const boutons = document.querySelectorAll("button[data-room]");
        const banniere = document.getElementById("hors-ligne");

        // --- Commandes : envoi, puis relecture de l'état ---
        boutons.forEach((bouton) => {
            bouton.addEventListener("click", async () => {
                try {
                    await fetch("/cmd", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            room: bouton.dataset.room,
                            device: bouton.dataset.device,
                            action: bouton.dataset.action,
                        }),
                    });
                } catch (e) {
                    banniere.hidden = false;
                    return;
                }
                rafraichir();
            });
        });

        // --- Retour d'état : GET /state ---
        // Réponse attendue : { "salon": { "lumiere1": true }, "cuisine": { "lumiere1": false } }
        async function rafraichir() {
            try {
                const rep = await fetch("/state", { cache: "no-store" });
                if (!rep.ok) throw new Error(rep.status);
                const etats = await rep.json();

                boutons.forEach((b) => {
                    const etat = etats[b.dataset.room]?.[b.dataset.device];
                    if (etat === true) b.dataset.state = "on";
                    else if (etat === false) b.dataset.state = "off";
                    else delete b.dataset.state;   // état inconnu
                });
                banniere.hidden = true;
            } catch (e) {
                banniere.hidden = false;
            }
        }

        rafraichir();
        setInterval(rafraichir, 3000);
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) rafraichir();
        });

        // --- Onglets ---
        const onglets = document.querySelectorAll(".tab");
        const pieces = document.querySelectorAll(".room");

        function afficher(id) {
            onglets.forEach((o) => o.classList.toggle("active", o.dataset.tab === id));
            pieces.forEach((p) => (p.hidden = p.id !== id));
            localStorage.setItem("onglet", id);
        }

        onglets.forEach((o) => o.addEventListener("click", () => afficher(o.dataset.tab)));

        // Réouvre la dernière pièce consultée
        const dernier = localStorage.getItem("onglet");
        if (dernier && document.getElementById(dernier)) afficher(dernier);
    </script>

</body>
</html>
